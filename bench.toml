[hooks]
# The runner requires a precondition hook; this layer's board state needs none.
precondition = "true"
build        = "just build"
bundle       = "just kiosk-bundle"

[tests]
host_suite   = "tests/host_suite"
target_suite = "tests/target_suite"

[github]
repo        = "WisewareOrg/meta-wisekiosk"
app_id      = 5286902
private_key = "~/.config/wisebench/app.pem"
check       = "bench-pipeline"

[run]
unit = "bench-run"
