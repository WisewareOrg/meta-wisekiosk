[hooks]
# Installs what the test helpers import (docs/testing.md).
precondition = "UV_PROJECT_ENVIRONMENT=build/test-packages uv sync --frozen --only-group tests --python 3.13"
build        = "just build"
bundle       = "just kiosk-bundle"

[tests]
host_suite   = "tests/host_suite"
target_suite = "tests/target_suite"

[github]
repo        = "WisewareOrg/meta-wisekiosk"
app_id      = 5286902
private_key = "~/.config/wisebench/app.pem"
check       = "bench-pipeline"

[run]
unit = "bench-run"
