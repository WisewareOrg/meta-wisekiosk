# Colon-joined onto the image config by `just testimage`.
header:
  version: 20

env:
  TEST_TARGET_IP: ""
  OEQA_JSON_RESULT_DIR: ""
  KIOSK_TARGET_ROLE: ""
  KIOSK_TARGET_HOSTNAME: ""

local_conf_header:
  testimage: |
    IMAGE_CLASSES += "testimage"
    TEST_TARGET = "simpleremote"
    TEST_SUITES = "kiosk"

    # required non-empty by testimage_sanity; unused
    TEST_SERVER_IP = "127.0.0.1"

    # do_testimage refreshes exactly these names into td from the live
    # datastore on every run, regardless of whether do_rootfs reran.
    # :append, not +=: += runs before testimage.bbclass's own ?= default
    # and would replace its five names outright, not add to them.
    TESTIMAGE_UPDATE_VARS:append = " KIOSK_TARGET_ROLE KIOSK_TARGET_HOSTNAME"
