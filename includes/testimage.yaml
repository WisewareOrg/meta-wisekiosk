# Colon-joined onto the image config by `just testimage`.
header:
  version: 20

env:
  TEST_TARGET_IP: ""
  OEQA_JSON_RESULT_DIR: ""
  KIOSK_TARGET_ROLE: ""
  KIOSK_TARGET_HOSTNAME: ""

local_conf_header:
  testimage: |
    IMAGE_CLASSES += "testimage"
    TEST_TARGET = "simpleremote"

    # The one spelling of the six case names: tools/oe-test.sh reads this
    # exact line for its own --run-tests, rather than a second copy.
    TEST_SUITES = "kiosk_backend_unit kiosk_healthz_bound kiosk_page_serves kiosk_health_flag kiosk_render kiosk_applied kiosk_backend_unreachable kiosk_recovery kiosk_browser_restart kiosk_config_errors kiosk_layout"

    # required non-empty by testimage_sanity; unused
    TEST_SERVER_IP = "127.0.0.1"

    # /work/local/keys is PIPELINE_KEYS_DIR's own mount (tools/kas-run.sh);
    # the case's __file__-derived repo root is kas-container's separate
    # /repo mount and cannot see it.
    KIOSK_HMAC_KEY = "/work/local/keys/hmac.key"

    # do_testimage refreshes exactly these names into td from the live
    # datastore on every run, regardless of whether do_rootfs reran.
    # :append, not +=: += runs before testimage.bbclass's own ?= default
    # and would replace its five names outright, not add to them.
    TESTIMAGE_UPDATE_VARS:append = " KIOSK_TARGET_ROLE KIOSK_TARGET_HOSTNAME KIOSK_HMAC_KEY"
