##########
# HEADER #
##########
header:
  version: 20
  includes:
    - includes/rauc.yaml

############
# DEFAULTS #
############
defaults:
  repos:
    branch: scarthgap

##################
# REPOS & LAYERS #
##################
# Every repo is pinned by commit. Floating on branch heads makes any manifest
# difference unattributable -- a rebuild would mix "what we changed" with "what
# upstream pushed since". Bumping a pin is an edit here, reviewed like any
# other; `just currency` reports which have fallen behind and
# docs/image.md holds the procedure.
repos:
  # No url: kas resolves this to the repository containing this config file.
  # meta-wisekiosk LAYERDEPENDS on the Raspberry Pi layers, so this file is not
  # usable alone -- it expects a platform include from includes/platforms/.
  meta-wisekiosk:
    layers:
      meta-wisekiosk:

  # Upstream, consumed as a dependency instead of forked. Pinned at its tip
  # (dormant since 2026-01-20). patches/ carries the change that cannot
  # be expressed from a downstream layer -- see patches/meta-autonomos/.
  meta-autonomos:
    url: "https://github.com/jsmith212/meta-autonomos.git"
    branch: main
    commit: f07174676c0ea702fc1de4379f7bf79967620c25
    path: "sources/meta-autonomos"
    layers:
      meta-autonomos-core:
    patches:
      02-wpa:
        repo: meta-wisekiosk
        path: "patches/meta-autonomos/0002-wpa-supplicant-stop-baking-credentials.patch"

  poky:
    url: "https://git.yoctoproject.org/git/poky"
    commit: 1397cd85032d1582fa4f2512a3f378d71ca39291
    path: "sources/poky"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  # https, not git://: git.openembedded.org and git.yoctoproject.org sit behind
  # Cloudflare, which refuses port 9418.
  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    commit: 96c2c78e13ff1b954715ff3c6d26bddd50a02509
    path: "sources/meta-openembedded"
    layers:
      meta-oe:
      meta-filesystems:
      meta-networking:
      meta-python:

  # wpewebkit, which neither poky nor meta-openembedded carries.
  meta-webkit:
    url: "https://github.com/Igalia/meta-webkit.git"
    branch: scarthgap-latest
    commit: 7a89fb5e1ed0b71ac44b7750b1db5dd6b9307821
    path: "sources/meta-webkit"

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    commit: 0a4b911d9fd63ab29c4532a907fae3282dbdcfe4
    path: "sources/meta-arm"
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    commit: e0b994c8457be2b32acf7b904fcc5408156de57a
    path: "sources/meta-virtualization"

  # A newer Go for the backend than poky scarthgap's 1.22.12; its conf/layer.conf
  # sets GOVERSION.
  # A second checkout of meta-lts-mixins, which carries one topic per branch --
  # includes/platforms/raspberrypi.yaml pins scarthgap/u-boot off the same url.
  meta-lts-mixins-go:
    url: "https://git.yoctoproject.org/meta-lts-mixins"
    branch: scarthgap/go
    commit: 9d6bbf30ae47275db2adc427d08bb3bd6cd14fe5
    path: "sources/meta-lts-mixins-go"

#######################
# BUILD CONFIGURATION #
#######################
local_conf_header:
  # The hash-equivalence server every build on this host shares -- one database,
  # not one per build dir. tools/kas-run.sh mounts it at /hashserv; README.md
  # §"Setting up a build host" has the one-time host setup.
  bitbake-hashserv: |
    BB_HASHSERVE = "unix:///hashserv/hashserv.sock"
