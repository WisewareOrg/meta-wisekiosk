# Opt-in buildhistory overlay, colon-joined by `just build-with-history`.
# Block name must stay unique across the include chain (kas merges by name).
header:
  version: 20

local_conf_header:
  buildhistory: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"

    # BUILDHISTORY_DIR stays at bitbake's default: build/buildhistory,
    # already gitignored.
