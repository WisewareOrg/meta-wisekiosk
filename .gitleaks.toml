[extend]
useDefault = true

# Allowlists development.key.pem, an upstream RAUC development private key vendored in this repo's
# git history; no fleet or build key is signed by it. The path is the vendored one because
# `gitleaks detect` scans history, not the worktree. See docs/updates.md.
[allowlist]
description = "Retired upstream RAUC development signing key, still in this repo's git history"
paths = ['''meta-autonomos-core/files/rauc-example-keys/development\.key\.pem''']
