[project]
name = "meta-wisekiosk"
version = "0.1.0"
description = "Python tooling pinned for this repository's guards and CVE/currency scripts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
# Bare --cov (no path) leaves the coverage source to [tool.coverage.run] source below, so it is
# defined in one place. :skip-covered collapses a fully-covered file to the summary line instead
# of listing it; a file under 100% still lists its missing lines.
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]
testpaths = ["meta-wisekiosk/lib/oeqa/runtime/cases"]
pythonpath = ["meta-wisekiosk/lib"]

[tool.coverage.run]
source = ["meta-wisekiosk/lib/oeqa/runtime/cases"]
branch = true
omit = [
    # Every case.py imports oeqa, unavailable on the host: this tier's
    # population is the pure verdict/record modules beside it, never the
    # oeqa case itself -- meta-wisekiosk/lib/oeqa/runtime/cases/README.md
    # has the why.
    "meta-wisekiosk/lib/oeqa/runtime/cases/*/case.py",
    "meta-wisekiosk/lib/oeqa/runtime/cases/*/tests/*",
]

[tool.coverage.report]
fail_under = 100
