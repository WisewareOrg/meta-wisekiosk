[project]
name = "meta-wisekiosk"
version = "0.1.0"
description = "Python tooling pinned for this repository's guards and CVE/currency scripts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "check-adrs",
    "check-reqs",
    "interrogate>=1.7.0",
    "pydoclint>=0.12.0",
    "python-kasa",
    "ruff>=0.17.6",
]
# what the test helpers import and the runner's environment lacks (docs/testing.md)
tests = [
    "websocket-client>=1.9.2",
]

[tool.uv.sources]
check-adrs = { git = "https://github.com/WisewareOrg/wise-ci", subdirectory = "check-adrs", rev = "375abaa8c7a9e1a98a95317ac955f3767efd8656" }
check-reqs = { git = "https://github.com/WisewareOrg/wise-ci", subdirectory = "check-reqs", rev = "375abaa8c7a9e1a98a95317ac955f3767efd8656" }
python-kasa = { git = "https://github.com/python-kasa/python-kasa", rev = "a1a6c3854ace705b21357b357354d4ae8b6307b4" }

[tool.pytest.ini_options]
# where bench.toml's precondition hook installs the tests group
pythonpath = ["build/test-packages/lib/python3.13/site-packages"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "D417", "SLF001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-short-docstrings = false
allow-init-docstring = true
