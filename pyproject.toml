[project]
name = "meta-wisekiosk"
version = "0.1.0"
description = "Python tooling pinned for this repository's guards and CVE/currency scripts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "check-reqs",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]
testpaths = ["tests/host_unit"]
pythonpath = ["tests"]

[tool.coverage.run]
source = ["tests/verdicts"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.uv.sources]
check-reqs = { git = "https://github.com/WisewareOrg/wise-ci", subdirectory = "check-reqs", rev = "4b3554d330465dee925aa10e0c62355903b1488a" }
