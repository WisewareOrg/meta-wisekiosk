name: guards

# A Yocto build is hours and cannot gate a commit. What CAN gate a commit is
# whether this public repository is about to publish something it should not,
# and whether the files a build reads still parse.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks detect scans history, not the worktree. A shallow clone
          # would scan almost nothing and pass for the wrong reason.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Guard 23 runs `uv run --locked check-reqs`, so uv and the dev group
      # must exist before "Run repository guards" below.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"

      - name: Install pinned Python tooling
        id: uv-sync
        run: uv sync --frozen --group dev

      - name: Run repository guards
        run: tools/ci-guards.sh

      # Pure stdlib, no install step. tools/doc-image.py is deliberately NOT
      # here: it compares prose against a built rootfs, CI never builds one, and
      # a required check that skips on every run is noise, not a gate.
      #
      # !cancelled(): this runs even when the guards step failed, matching the
      # hook and `just verify` -- two independent findings are worth more than
      # the first one twice. The job still fails if either step does, and unlike
      # always() a cancelled run stays cancelled.
      - name: Check Markdown cross-references
        if: ${{ !cancelled() }}
        run: python3 tools/doc-links.py

      # The half gitleaks and the guards' IP check structurally cannot see: a
      # hostname, an SSID, a MAC, a board serial, a machine-id. Its own step so
      # a failure names the identity scan rather than "guards", and so it runs
      # even when an earlier step failed. ci-guards guard 11 asserts this step
      # still exists.
      #
      # --allow-partial is a DECLARED limit, not a convenience: the known-value
      # half reads gitignored local/device-identity.md, which a clone cannot
      # have, so this step is the pattern half only and a hostname or an SSID is
      # invisible to it. Everywhere the map does exist the scan fails rather
      # than exit 0 on a search it could not perform. Closing the gap needs the
      # map in the runner, not a looser scanner.
      - name: Scan for device identity
        if: ${{ !cancelled() }}
        run: tools/scrub-identity.py --check --allow-partial

      # The real, networked run; guard 24 above is its fixture-only self-test.
      # See docs/requirements/README.md.
      - name: Check locally-cited upstream requirements
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/upstream-reqs-check.py

      # meta-wisekiosk/lib/oeqa/runtime's own suite (framework/ and cases/),
      # gated at 100% coverage (pyproject.toml). uv is already set up above,
      # for guard 23.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: ${{ !cancelled() }}
        with:
          just-version: "1.58.0"

      # Gated on uv-sync's own outcome, not just !cancelled().
      - name: Run the oeqa framework/cases test suite
        if: ${{ !cancelled() && steps.uv-sync.outcome == 'success' }}
        run: just test
