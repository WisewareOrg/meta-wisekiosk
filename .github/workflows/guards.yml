name: guards

# `just check`, then a gitleaks scan of the history.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks detect scans history; a shallow clone scans almost nothing.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Install the pinned dev environment
        run: uv sync --locked

      # The known-value half of the identity scan reads gitignored local/device-identity.md,
      # which a clone lacks, so --allow-partial.
      - name: Run the checks
        run: uv run --locked just check --allow-partial

      # !cancelled(): runs even when the checks failed.
      - name: Scan the history for secrets
        if: ${{ !cancelled() }}
        run: gitleaks detect --config .gitleaks.toml --no-banner --redact --exit-code 1
