name: guards

# The prechecks, Markdown cross-references, the identity scan, requirements, ADRs and a gitleaks scan.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks detect scans history; a shallow clone scans almost nothing.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Install the pinned dev environment
        run: uv sync --locked

      - name: Run the prechecks
        run: uv run --locked pytest tests/prechecks tests/applications/screenshot/test_decoder.py

      # !cancelled(): runs even when an earlier step failed.
      - name: Check Markdown cross-references
        if: ${{ !cancelled() }}
        run: python3 tools/doc-links.py

      # The known-value half of the identity scan reads gitignored local/device-identity.md,
      # which a clone lacks, so --allow-partial.
      - name: Scan for device identity
        if: ${{ !cancelled() }}
        run: python3 tools/scrub-identity.py --check --allow-partial

      - name: Check the requirements tree
        if: ${{ !cancelled() }}
        run: uv run --locked check-reqs --root docs/requirements

      - name: Check the ADRs
        if: ${{ !cancelled() }}
        run: uv run --locked check-adrs

      - name: Scan the history for secrets
        if: ${{ !cancelled() }}
        run: gitleaks detect --config .gitleaks.toml --no-banner --redact --exit-code 1
