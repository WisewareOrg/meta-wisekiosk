name: guards

# Repository guards, requirements and ADR checks, Markdown cross-references and the identity scan.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks detect scans history; a shallow clone scans almost nothing.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      # uv: the wise-ci actions, and `uv sync`, which builds the .venv ci-guards.sh uses
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Install the pinned dev environment
        run: uv sync --locked

      - name: Run repository guards
        run: tools/ci-guards.sh

      # !cancelled(): runs even when the guards step failed.
      - uses: WisewareOrg/wise-ci/check-reqs@5a7cd6159273348954552363d6b1a00d3e732512
        if: ${{ !cancelled() }}
        with:
          root: docs/requirements

      # !cancelled(): runs even when an earlier step failed.
      - uses: WisewareOrg/wise-ci/check-adrs@5a7cd6159273348954552363d6b1a00d3e732512
        if: ${{ !cancelled() }}

      # Pure stdlib, no install step. tools/doc-image.py is not run: it needs a built rootfs.
      #
      # !cancelled(): runs even when an earlier step failed; a cancelled run stays cancelled.
      - name: Check Markdown cross-references
        if: ${{ !cancelled() }}
        run: python3 tools/doc-links.py

      # Pattern half of the identity scan: the known-value half reads gitignored
      # local/device-identity.md, which a clone lacks, so --allow-partial.
      # ci-guards.sh guard 11 (the identity scan wired into every route) asserts this step exists.
      - name: Scan for device identity
        if: ${{ !cancelled() }}
        run: tools/scrub-identity.py --check --allow-partial
