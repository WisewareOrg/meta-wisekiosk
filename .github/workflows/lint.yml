name: lint

# Static analysis of the shell scripts and the workflow files.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version   # preinstalled on ubuntu-latest runners
          # Every tracked *.sh/*.bash file plus any file whose shebang invokes
          # sh/bash. Justfile [script('bash')] bodies are not linted here.
          shebang() {
            local f line
            git ls-files | while IFS= read -r f; do
              [ -f "$f" ] || continue
              line=$(head -n1 -- "$f" 2>/dev/null || true)
              case "$line" in
                '#!'*sh|'#!'*sh\ *) printf '%s\n' "$f" ;;
              esac
            done
          }
          mapfile -t files < <( { git ls-files -- '*.sh' '*.bash'; shebang; } | sort -u | sed '/^$/d')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found -- failing rather than passing empty."; exit 1
          fi
          printf 'Linting %d files:\n' "${#files[@]}"; printf '  %s\n' "${files[@]}"
          shellcheck -x -- "${files[@]}"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          VER=1.7.12
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          sudo tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
          actionlint -version

      - name: Run actionlint
        # actionlint runs shellcheck over each workflow's run: blocks.
        run: actionlint -color
