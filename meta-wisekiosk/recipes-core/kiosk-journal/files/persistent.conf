[Journal]
Storage=persistent

# The flush at ~25s scales with CURRENT journal size and lands before the wlan0 gate: at 77-81MB it cost
# 1.91-2.02s, at 19-21MB it costs 1.12-1.20s.
#
# The size kept is kiosk-journal-vacuum's 64 MB. This 128 MB is journald's backstop, which must not be what
# normally runs: its size vacuum orders files by their earliest timestamp, every boot's start is stamped with
# the clock from before the restore, so the newest boot's start sorts oldest and is deleted first.
SystemMaxUse=128M
SystemMaxFileSize=8M
