[Journal]
Storage=persistent

# The flush scales with the current journal's size and lands before the wlan0 gate.
#
# kiosk-journal-vacuum sets the size kept. This is journald's backstop, which must not be what normally runs:
# its size vacuum orders files by their earliest timestamp, and every boot's start is stamped with the clock
# from before the restore.
SystemMaxUse=128M
SystemMaxFileSize=8M
