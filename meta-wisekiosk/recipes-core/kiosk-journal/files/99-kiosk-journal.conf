# Journal storage on /data, linked from /var/log/journal.
# L takes Type Path Mode User Group Age Argument: four dashes before the target; a fifth is read
# as Age and the link breaks.
d /data/log         0755 root root            - -
d /data/log/journal 2755 root systemd-journal - -
L /var/log/journal  -    -    -               - /data/log/journal
