# Bind timesyncd's state dir onto /data. BindPaths, not a symlink: timesyncd runs
# ProtectSystem=strict, so a write through a symlink outside its sandbox fails read-only. The
# leading `-` skips the bind when /data/systemd-timesync is missing. Wants=, not Requires=, so a
# failed stage does not cancel NTP; Wants= is also what re-runs the stager at every timesyncd start.
[Unit]
Wants=kiosk-timesync-dir.service
After=kiosk-timesync-dir.service data.mount

[Service]
BindPaths=-/data/systemd-timesync:/var/lib/systemd/timesync
