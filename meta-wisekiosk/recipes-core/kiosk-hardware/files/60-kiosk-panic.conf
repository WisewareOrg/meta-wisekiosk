# Reboot rather than sit forever on a panic. This does NOT cover an early panic
# -- systemd-sysctl runs at ~11.7s and the observed mmc_rescan panic is at 4.0s,
# which only panic=10 on the kernel command line reaches; that value is in /boot and
# stays 10 while this file says 1. Kept for panics and oopses that happen after
# userspace is up.
kernel.panic = 1
kernel.panic_on_oops = 1
