# Keep modules with no consumer on this kiosk out of the boot.
#
#   raspberrypi_gpiomem provides /dev/gpiomem; nothing on this kiosk uses GPIO
#   uio, uio_pdrv_genirq userspace-IO plumbing with no consumer here
#
# Kept for the resident module memory, not for boot time.
#
# Class 1 -- reversible over SSH. Delete this file and reboot.
#
# NOT included, and must not be: drm / backlight / drm_panel_orientation_quirks.
# They load at 9.6s via modprobe@drm.service, well before brcmfmac binds and
# wlan0 appears, which every downstream unit waits on (the investigation above
# measures that wait). DRM is the display path this image builds -- vc4 KMS
# drives the panel through it, and WebKit's accelerated backing store needs its
# render node -- so blacklisting drm blanks the kiosk rather than saving anything.
install raspberrypi_gpiomem /bin/true
install uio_pdrv_genirq /bin/true
install uio /bin/true

blacklist raspberrypi_gpiomem
blacklist uio_pdrv_genirq
blacklist uio
