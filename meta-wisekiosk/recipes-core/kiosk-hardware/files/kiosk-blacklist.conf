# Modules with no consumer here, kept out of memory.
#   raspberrypi_gpiomem   provides /dev/gpiomem
#   uio, uio_pdrv_genirq  userspace-IO plumbing
#
# Never blacklist drm, backlight or drm_panel_orientation_quirks: DRM is the display path.
install raspberrypi_gpiomem /bin/true
install uio_pdrv_genirq /bin/true
install uio /bin/true

blacklist raspberrypi_gpiomem
blacklist uio_pdrv_genirq
blacklist uio
