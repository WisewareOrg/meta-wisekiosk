# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# The shared oeqa test base and record parsing, importable as framework.*
# under testimage the same way as any other layer's own addpylib -- the
# cases/ directory itself is a separate, poky-managed path and needs none.
addpylib ${LAYERDIR}/lib/oeqa/runtime framework

BBFILE_COLLECTIONS += "wisekiosk"
BBFILE_PATTERN_wisekiosk = "^${LAYERDIR}/"
# Above autonomos-core (6), autonomos-raspberrypi (7) and meta-raspberrypi (9):
# this layer appends recipes owned by all three, and where two layers carry a
# bbappend or a file for the same recipe, this layer's must win FILESPATH.
BBFILE_PRIORITY_wisekiosk = "10"

LAYERDEPENDS_wisekiosk = " \
    core \
    openembedded-layer \
    raspberrypi \
    rauc \
    autonomos-core \
    autonomos-raspberrypi"

LAYERSERIES_COMPAT_wisekiosk = "scarthgap"
