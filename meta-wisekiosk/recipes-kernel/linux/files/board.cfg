# Kernel configuration for this board: a menu is switched off where it holds only what goes, and a symbol is
# switched off by itself where its menu also holds something kept.
# A line that names a symbol something else selects has no effect; none is here.
# NETFILTER stays: meta-autonomos's k3s-netfilter.cfg owns it.

# Hardware this board has none of. SND and SND_SOC stay: DRM_VC4 depends on them.
