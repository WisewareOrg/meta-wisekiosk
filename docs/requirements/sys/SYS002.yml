rationale: |
  Decomposed by the browser's own recovery from being killed, without a person at the panel,
  and by the kiosk coming back showing its display after an update, without anyone attending
  it (SRS008). A misprovisioned unit's own fault display is a decomposed need too, inactive
  until an appliance-level fault display exists to verify it against.
