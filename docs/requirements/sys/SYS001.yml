text: |
  The appliance shall host a WiseKiosk instance and display it on its panel.
verification-justification: |
  Verified only through its children. Its checks settle that the instance is brought back to the
  panel after the faults they induce, that it comes up promptly from power-on, and that it can reach
  its data. Motion without stutter has no check until its bound is set. Unproven: what reaches the
  glass when the panel itself is off or disconnected, and every fault not yet seen.
verification-method: test
