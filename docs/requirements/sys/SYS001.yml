header: |
  Hosts and displays WiseKiosk
level: 1.0
links: []
normative: true
rationale: |
  Its checks settle that the instance is brought back to the panel after the faults they induce,
  that it comes up promptly from power-on, that it can reach its data, that no pointer is drawn, and
  that its memory stays bounded. Motion without stutter has no check until its bound is set.
  Unproven: what reaches the glass when the panel itself is off or disconnected, and every fault not
  yet seen.
