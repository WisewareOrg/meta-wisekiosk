rationale: |
  Its checks settle that the instance is brought back to the panel after the faults they induce,
  that it comes up promptly from power-on, that it can reach its data, and that no pointer is drawn.
  Motion without stutter has no check until its bound is set. Unproven: what reaches the glass when
  the panel itself is off or disconnected, and every fault not yet seen.
