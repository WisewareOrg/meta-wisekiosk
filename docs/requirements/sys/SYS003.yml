header: |
  Configured and maintained over the air
level: 1.1
links: []
normative: true
rationale: |
  Its checks settle that the operator can install an image update and change the configuration over
  the air, that the appliance refuses an image update not meant for it, that the operator can open a
  remote shell, and that the appliance falls back from an image update that cuts the operator off.
  Falling back from a configuration change has no bound set. Unproven: any way of losing the
  operator's access that its checks do not induce.
