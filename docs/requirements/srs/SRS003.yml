text: |
  The WiseKiosk instance shall be able to fetch its data whenever the site network gives the
  appliance internet access.
verification-justification: |
  Test. The check beneath it exercises the instance's own fetches and reads whether each was
  answered, so the result needs no judgement. It answers them from a proxy on the test host,
  reached through a tunnel on the appliance's own loopback, so the instance's fetches never take
  the site network, and the check does not show that the appliance reaches its upstream over it.
verification-method: test
