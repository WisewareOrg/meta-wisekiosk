text: |
  A configuration change that cuts the operator off from the appliance, by its remote shell or over
  the air, shall be undone by the appliance itself, leaving it on its previous configuration.
verification-justification: |
  Test. Each check beneath it injects the fault and observes the recovery from outside the
  appliance, so the result needs no judgement.
