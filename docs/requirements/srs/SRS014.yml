text: |
  The kiosk shall refuse any update its maintainer did not sign, or that was not built for this
  kind of unit, and keep running what it ran.
verification-justification: |
  It leaves unproven the safety of the signing key. Changes made through service access bypass the
  update path entirely, and that access is open by design.
