rationale: |
  The WiseKiosk application shows time in the appliance's timezone, so the panel shows local time
  only when the appliance's timezone is the site's. Its check settles that a timezone set over the
  air is the one the appliance keeps time in. Unproven: that a timezone set over the air holds across
  an image update, which the check never tries, since its zone lives only until the check undoes
  it.
