text: |
  The display shall report a missing, unparsable or rejected configuration file as such,
  distinctly for each case, and shall apply once a valid configuration file is in place.
verification-justification: |
  Settles that each of the three states is read back distinctly and that applying resumes once
  the file is valid. Leaves unproven whether the operator-facing wording is itself correct.
