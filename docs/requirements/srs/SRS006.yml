text: |
  The display shall show a fault when its configuration is broken, never a blank or stale
  display, and shall apply again once a valid configuration is in place.
verification-justification: |
  Settles that a fault is shown when the configuration is broken, and that applying resumes
  once a valid configuration is restored. Leaves unproven the fault's own wording, and
  distinguishing why the configuration is broken -- the application's own behaviour is its own
  tier's.
verification-method: test
