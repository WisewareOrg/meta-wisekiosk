rationale: |
  The WiseKiosk application shows time in the appliance's timezone, so the panel shows local time
  only when the appliance's timezone is the site's. Its check settles that a timezone set over the
  air is the one the appliance keeps time in; that it holds is SRS011's (configuration changed over
  the air).
