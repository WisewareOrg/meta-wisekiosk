header: |
  Recovers the instance to the panel
level: 1.1
links:
- SYS001: 8SdZkohcyDrGQAGwxe-w6XzBd-UUhNYMV9efIjQBnLk=
normative: true
rationale: |
  A check counts the instance on the panel when the browser shows the instance the appliance serves
  and a screen capture is not a single uniform colour. Its checks settle recovery from the faults
  they induce: a browser kill, a kernel crash, a frozen page, an image update carrying a new
  application build, the panel left untouched past its blanking time, and sustained network load,
  and, once the bench has power control, a power cut while showing and during an image update.
  Unproven: any way of losing the panel the checks do not induce, such as a userspace hang with the
  kernel still running, a crash loop, a freeze from the application's own error, or a partial
  freeze; and a fault that recurs on every boot.
ref: ''
reviewed: wdnLSD2_qmdGveGONKZVzqXUHyWXDHNEIg32R9t-Orw=
status: proposed
text: |
  If the panel stops showing the live WiseKiosk instance, the appliance shall detect it and bring
  the instance back, with nobody at the panel.
verification-justification: |
  Test. Each check beneath it injects the fault and observes the recovery from outside the
  appliance, so the result needs no judgement.
verification-method: test
