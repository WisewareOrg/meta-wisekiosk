text: |
  If the panel stops showing the live WiseKiosk instance, the appliance shall detect it and bring the
  instance back, with nobody at the panel.
verification-justification: |
  A check counts the instance on the panel when the browser shows the instance the appliance serves
  and a screen capture is not a single uniform colour. Its checks settle recovery from the faults
  they induce: a browser kill, a kernel crash and a frozen page, and, once the bench has power
  control, a power cut while showing and during an update. Unproven: any way of losing the panel the
  checks do not induce, such as a userspace hang with the kernel still running, a crash loop, a
  freeze from the application's own error, or a partial freeze; and a fault that recurs on every
  boot.
verification-method: test
