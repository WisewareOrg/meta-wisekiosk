text: |
  Once the backend is reachable again, the display shall stop reporting the outage and every
  module it is holding behind one shall draw again, with nobody attending the display.
verification-justification: |
  Settles that the outage report clears and every stood-down module resumes drawing once the
  backend answers again, on the same page instance. Leaves unproven recovery from a fault whose
  cause is not a reachability change.
