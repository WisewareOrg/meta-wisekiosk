text: |
  After an update, the kiosk shall come back showing its display without anyone attending it.
verification-justification: |
  Settled by two decompositions of how an update can fail to do that: the image's display
  service is set to show the display as designed (TST008, read from the shipped image itself);
  the services the image ships load on the booted board (TST010, as the board's own systemd
  reports). Leaves unproven what the display shows once up (SRS001, SRS007) and an install that
  bypasses kiosk-preflight.
verification-method: test
