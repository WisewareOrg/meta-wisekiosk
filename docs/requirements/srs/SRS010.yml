header: |
  Refuses image updates not meant for it
level: 2.1
links:
- SYS003: cRbRUHcska9Gg8_qBIQ44q1JJ1fwC1Ypo3s3G8eRzCM=
normative: true
rationale: |
  An image update is meant for it when one of its operators signed it and it was built for its kind
  of hardware. Settles refusal of an image update signed by a key no operator holds, and of one
  built for a different kind of hardware. Unproven: an image update that is signed correctly but
  carries a bad image, which SRS013 (falls back from an image update that cuts it off) covers.
