verification-justification: |
  Settles that the built rootfs's own display-launch unit carries the designed flags and that
  its served entry point is present, read from this build's own artifacts. Both failure
  branches are proven on constructed input and were watched failing on a mutated copy of the
  artefact when the check was built. Leaves unproven whether a runtime override later changes
  any of this once the image is deployed, and whether every shipped unit is itself loadable
  (TST006, *Shipped units load on the board*, the same obligation's device-tier check).
