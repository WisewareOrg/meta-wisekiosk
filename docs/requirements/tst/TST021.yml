status: proposed
text: |
  With the appliance holding its configuration, cut its power without warning and restore it. Pass
  if the configuration it holds afterwards is byte for byte the one it held before.
verification-justification: |
  Test. It exercises the capability and reads the result mechanically; the pass condition needs no
  judgement.
  The test makes no change itself: it checks the configuration the appliance already holds.
verification-method: test
