header: |
  Configuration held across a power cut
level: 2.3.3
links:
- SRS010: cXUUm3LnnNsW2-SqUXIWeXYkTUWlEIeSDrD3ofOF6Zg=
normative: true
rationale: |
  An operator who changes the appliance's configuration expects it to stay changed. A power cut is
  the unclean end a wall-mounted unit can suffer, so a configuration lost to it would silently put
  the appliance back on the settings the operator had moved away from.
