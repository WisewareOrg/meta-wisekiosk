text: |
  Install a valid image update over the air on an appliance holding its operator's configuration.
  Pass if the configuration it holds after it restarts is byte for byte the one it held before.
verification-justification: |
  Test. It exercises the capability and reads the result mechanically; the pass condition needs no
  judgement.
