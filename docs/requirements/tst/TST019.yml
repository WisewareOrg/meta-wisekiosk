text: |
  Change the appliance's configuration over the air, then install a valid image update over the air.
  Pass if the configuration the appliance holds after it restarts is the changed one.
verification-justification: |
  Test. It exercises the capability and reads the result mechanically; the pass condition needs no
  judgement.
