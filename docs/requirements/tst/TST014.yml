text: |
  Record the time from the page's load to the first probe sample showing the display's
  frame, nothing loading, the weather present and the replay set's expected cards.
verification-justification: |
  Records the time read at the window's start, on the replayed page, on one physical device,
  one boot, the window voided unless both reads show the replay set's expected page state and
  the page counts no state change between them. Asserts no bound until the baseline campaign derives one, so until then a value
  is recorded, never failed. Leaves unproven how long the board takes to start the browser,
  which the page's own load clock does not see.
verification-method: test
