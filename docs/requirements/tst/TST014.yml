status: proposed
text: |
  With the WiseKiosk instance on the panel, run the appliance for 30 minutes, sampling its memory
  use. Pass if it stays under 80% of usable memory throughout, its use grows by no more than 100 MB
  from the start of the window to its end, and no process is killed for memory. The check is invalid
  if the board restarts without a memory kill, the browser or backend restarts, the page reloads or
  changes state, the sampling leaves a gap, the replay kills a request, or the evidence is unreadable.
verification-justification: |
  Test. It measures against a stated bound; the pass condition needs no judgement.
verification-method: test
