text: |
  Restart the appliance over the network, with nobody at the panel. Pass if, within 60 s of the
  restart, the appliance serves the WiseKiosk instance's page with the browser running.
verification-justification: |
  Test. It measures against a stated bound; the pass condition needs no judgement.
  It stops at the page served with the browser running; the time from the browser starting to the
  instance applied is TST001<!-- Browser killed -->'s.
