text: |
  Install over the network an update whose image starts but cannot reach the site network. Pass
  if, with nobody at the panel, the kiosk returns by itself to its previous image, reachable for
  service and showing the page.
verification-justification: |
  Settles fallback from an image that boots but cannot be serviced. Leaves unproven an update that
  is reachable but shows no page, which this need excludes by its own definition.
verification-method: test
