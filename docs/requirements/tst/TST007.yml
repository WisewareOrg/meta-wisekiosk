text: |
  While the kiosk shows the page, cut its power without warning, then restore it. Pass if it comes
  up showing the WiseKiosk page in its ready state with nobody at the panel.
verification-justification: |
  Settles one unclean cut at one moment. Leaves unproven other moments, repeated cuts, and a cut
  during a write to the shared boot files.
