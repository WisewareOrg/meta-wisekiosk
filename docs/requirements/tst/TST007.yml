text: |
  Read the device's reported viewport size and assert it is at least 1280x720, and assert the
  band and every region clear each other and the configured edge margin, and assert a mode
  below the floor is reported as such when the connected output offers one.
verification-justification: |
  Settles the floor, band clearance and edge-margin clearance at the viewport observed at test
  time, on one physical device, one boot, and that a seeded below-floor mode is reported as a
  floor failure where the seed reaches the browser's own viewport (bench acceptance run, cited
  in the PR). Leaves unproven layout at a mode below the floor on a connector that offers none
  to seed, or whose display-launch script re-asserts its own mode on every restart.
verification-method: test
