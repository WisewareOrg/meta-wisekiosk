text: |
  Read the mode xrandr reports and assert it is at least 1280x720, and assert a mode below the
  floor is reported as such when the connected output offers one.
verification-justification: |
  Settles the floor at the mode xrandr reports, on one physical device, one boot, and that a
  seeded below-floor mode is reported as a floor failure where the seed reaches the reported
  mode (bench acceptance run, cited in the PR). Leaves unproven anything about the display at
  a mode below the floor on a connector that offers none to seed, or whose display-launch
  script re-asserts its own mode on every restart, and the application's own screen layout --
  the application's own behaviour is its own tier's.
verification-method: test
