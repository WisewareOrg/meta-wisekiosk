text: |
  With the appliance powered off and nobody at the panel, apply power. Pass if, within 110 s of
  power returning, the browser has finished loading the WiseKiosk instance's page.
verification-justification: |
  Test. It measures against a stated bound; the pass condition needs no judgement.
  It stops at the page loaded in the browser: whether the app has applied its configuration is not
  observed, because nothing can be placed on the appliance to see it across a power cut.
verification-method: test
