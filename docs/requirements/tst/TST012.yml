  On the second boot of the updated slot, over the 300 s window starting 15 s after the page
  loads, record the longest interval between two frames.
verification-justification: |
  Records the metric over one 300 s window on the replayed page, on one physical device,
  one boot, the window voided unless both reads show the replay set's expected page state and
  the page counts no state change between them. Asserts no bound until the baseline campaign derives one, so until then a value
  is recorded, never failed.
  Leaves unproven how often freezes recur (TST013) and the frame rate around them (TST011).
