text: |
  With the kiosk unable to learn the time from the network, cut its power, restore it, and install
  a valid update. Pass if it accepts the update and runs it.
verification-justification: |
  Settles that a cold start does not leave the kiosk unable to accept updates. Leaves unproven a
  signing certificate issued after the last time the kiosk knew, which can still be refused.
verification-method: test
