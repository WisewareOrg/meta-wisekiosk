header: |
  Image that cannot reach the network
level: 2.5.2
links:
- SRS012: g4fr8dj_fdpvkjPL1q-4VBxy9Gtng0JG2Uj35CMSJus=
normative: true
rationale: |
  An image update that starts but cannot join the network leaves the appliance running and out of
  the operator's reach, which a boot that fails outright does not. It has to undo that itself, with
  the site network healthy, and still take the next valid image update.
ref: ''
references:
