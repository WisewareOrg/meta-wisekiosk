header: |
  Image that cannot reach the network
level: 2.5.2
links:
- SRS012: g4fr8dj_fdpvkjPL1q-4VBxy9Gtng0JG2Uj35CMSJus=
normative: true
rationale: |
  An image update that starts but cannot join the network leaves the appliance running and out of
  the operator's reach, which a boot that fails outright does not. It has to undo that itself, with
  the site network healthy, and still take the next valid image update.
ref: ''
references:
- keyword: def test_cannot_reach_the_network
  path: tests/target_suite/test_image_update.py
  sha: 12eac44d303ac27f0a4cf8d58dd353d8c5cb9adb762db4539e08620447776492
  type: file
reviewed: uCxRDneeGTyRo2k-fXifZVV6CY6ksGC-KE-NCse6dmM=
status: proposed
text: |
  With the site network healthy and nobody at the panel, install over the air an image update that
  starts but cannot join the network, its site configuration unchanged. Pass if the appliance is
  back on its previous build within three failed attempts to start the image update, and accepts a
  valid image update over the air.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
verification-method: test
