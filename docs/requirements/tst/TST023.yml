text: |
  With nobody at the panel, install over the air an image update that cannot start. Pass if the
  appliance is back on its previous build within three failed attempts to start the image update,
  and accepts a valid image update over the air.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
