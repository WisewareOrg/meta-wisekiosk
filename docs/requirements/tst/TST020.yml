text: |
  Offer the kiosk an update signed by any key other than its maintainer's. Pass if it refuses to
  install it and keeps running and showing what it ran before.
verification-justification: |
  Settles refusal of a foreign signer. Leaves unproven an update altered after signing, the safety
  of the maintainer's key, and changes made through service access.
verification-method: test
