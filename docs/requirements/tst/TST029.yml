text: |
  Cut the running appliance off the site network at the appliance itself, then restore it. Pass if
  the operator can open a remote shell within 30 s of the network returning.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
