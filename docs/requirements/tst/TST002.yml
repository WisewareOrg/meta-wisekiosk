text: |
  On the started kiosk, read the panel's active screen size and the size of the area the page is
  drawn in. Pass if the page area covers the whole screen and the screen is no smaller than the
  floor the check carries. Fail otherwise.
verification-justification: |
  Settles that the page fills the mode actually set, and the floor. Leaves unproven a panel whose
  native size is below the floor, and the layout inside the page.
verification-method: test
