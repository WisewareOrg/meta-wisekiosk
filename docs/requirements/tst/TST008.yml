text: |
  With the WiseKiosk instance on the panel, hold the appliance's network under sustained load for
  60 s. Pass if the panel shows the live instance throughout, or is back within 60 s of any time it
  stops.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
