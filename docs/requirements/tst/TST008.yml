text: |
  Cut power while an update is being installed, then restore it. Pass if the kiosk comes up
  showing the WiseKiosk page in its ready state, on either image, with nobody at the panel.
verification-justification: |
  Settles a cut at one point in an install. Leaves unproven a cut while the update writes the boot
  files both images share, which can leave neither image bootable.
verification-method: test
