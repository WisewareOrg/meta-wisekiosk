text: |
  With nobody at the panel, install over the air a valid image update carrying a different WiseKiosk
  build from the one running. Pass if the WiseKiosk instance is on the panel within 160 s of the
  appliance restarting into it.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
