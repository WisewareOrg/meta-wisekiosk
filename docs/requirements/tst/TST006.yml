text: |
  Break the device's configuration file (unparsable content) and assert a fault is shown
  within the deadline; restore it and assert the display applies again within the deadline.
verification-justification: |
  Settles that a fault is shown within 90 s of a broken configuration taking effect, and that
  applying resumes within 90 s of restoring a valid one, on one physical device, one boot.
  Leaves unproven the fault's own wording, and distinguishing why the configuration is broken
  -- the application's own behaviour is its own tier's.
