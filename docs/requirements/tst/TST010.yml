text: |
  Install over the network an update whose image cannot start. Pass if, with nobody at the panel,
  the kiosk returns by itself to its previous image, reachable for service and showing the page.
verification-justification: |
  Settles fallback from an image that never boots. Leaves unproven a fault in the shared boot
  files.
verification-method: test
