text: |
  With the WiseKiosk instance set to fetch through a proxy that answers its upstream from a
  recording of it, start the instance and let it fetch its data over HTTPS from its own process
  context on the appliance. Pass if every request the recording holds is answered from it at least
  once, and none of the instance's requests goes unanswered.
verification-justification: |
  Test. It exercises the capability and reads the result mechanically; the pass condition needs no
  judgement.
