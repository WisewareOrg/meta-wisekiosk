status: proposed
text: |
  With nobody at the panel, restart the appliance with the WiseKiosk backend held back from starting
  until after the browser has started. Pass if the WiseKiosk instance is on the panel within 60 s
  of the backend first answering.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement. The restart is of the appliance's userspace only, because that is the restart
  the backend can be held across with nothing written to the appliance's storage.
verification-method: test
