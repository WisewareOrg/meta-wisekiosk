normative: true
rationale: |
  At power-on the browser can start before the backend answers. A browser left on its own error
  page keeps the instance off the panel, and with nobody at the panel nobody brings it back.
ref: ''
references:
- keyword: def test_back_after_a_fault
  path: tests/target_suite/test_back_on_the_panel.py
