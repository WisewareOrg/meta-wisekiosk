status: proposed
text: |
  Offer the appliance an image update signed by one of its operators but built for a different kind
  of hardware. Pass if it refuses the image update and is still running the same build, with the
  WiseKiosk instance on the panel.
verification-justification: |
  Test. It exercises the capability and reads the result mechanically; the pass condition needs no
  judgement.
