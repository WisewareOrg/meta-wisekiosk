text: |
  With nobody at the panel, crash the kernel over the network so that nothing on the appliance runs.
  Pass if the appliance restarts by itself and, within 60 s of the crash, serves the WiseKiosk
  instance's page with the browser running.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
  It stops at the page served with the browser running; the time from the browser starting to the
  instance applied is TST001<!-- Browser killed -->'s.
