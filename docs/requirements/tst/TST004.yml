text: |
  While the page is showing, capture the screen twice, some seconds apart. Pass if the two
  captures differ and neither is blank or a single colour. Fail otherwise.
verification-justification: |
  Settles that the display server's image is advancing across one interval. Leaves unproven a
  freeze that starts later, and the glass itself. A page legitimately still between captures fails
  falsely.
verification-method: test
