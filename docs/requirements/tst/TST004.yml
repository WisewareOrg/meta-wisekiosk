text: |
  With nobody at the panel, crash the kernel over the network so that nothing on the appliance runs.
  Pass if the appliance restarts by itself and, within 100 s of the crash, serves the WiseKiosk
  instance's page with the browser running.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
  It stops at the page served with the browser running. A boot's own time to the instance on the
  panel is TST012<!-- Pending: Cold boot to the panel -->'s.
verification-method: test
