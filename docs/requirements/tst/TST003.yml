text: |
  Leave the kiosk showing the page, untouched, for longer than the display's default blanking
  time. Then capture the screen, and read from the display whether it has powered the panel down
  and whether it is drawing a pointer. Pass if the capture is not blank, the panel is not powered
  down, and no pointer is drawn.
verification-justification: |
  Settles blanking and pointer at one point past the default timeout. A screen capture alone shows
  neither power-down nor the pointer, so both are read from the display. Leaves unproven the
  panel's own hardware power saving, and longer timescales.
verification-method: test
