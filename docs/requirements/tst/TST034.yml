text: |
  With nobody at the panel, crash the WiseKiosk backend by killing it outright, and have the browser
  start again while the backend is down. Pass if the WiseKiosk instance is on the panel within 60 s
  of the backend first answering again.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
