  type: file
reviewed: Hf9n_mxtQIOZgja-t3F5-eItMr1lNZjLZbTH1QtT398=
status: proposed
text: |
  With the site network up, set the appliance's clock wrong by days, then restart the appliance and
  confirm its clock is still wrong. Pass if, within 100 seconds of the appliance starting up again, its
  clock agrees with the network's time. The check is invalid if the clock is not still wrong after
  the restart.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
verification-method: test
