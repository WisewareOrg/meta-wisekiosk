rationale: |
  The recorded clock is what a restart trusts, so a clock wrong by days when the appliance goes down
  stays wrong when it comes back until the network corrects it. The viewer must not be left with a
  panel showing the wrong time or an instance cut off from its data.
ref: ''
references:
- keyword: def test_back_after_a_fault
  path: tests/target_suite/test_back_on_the_panel.py
  sha: f858f755299c689353a7a60f98b07e2bc772a4aca80f9e7abcaa9f5b7edb7f73
  type: file
reviewed: 1vvM8YZ2C-8RRwOmOm15_Xr2mihOyXu3sZAZ6Ekxbo0=
status: proposed
text: |
  With the site network up, set the appliance's clock wrong by days, then restart the appliance and
  confirm its clock is still wrong. Pass if, within 100 seconds of the appliance starting up again, its
  clock agrees with the network's time. The check is invalid if the clock is not still wrong after
  the restart.
verification-justification: |
  Test. It injects the fault and observes the result from outside the appliance; the pass condition
  needs no judgement.
verification-method: test
