normative: true
rationale: |
  The recorded clock is what a restart trusts, so a clock wrong by days when the appliance goes down
  stays wrong when it comes back until the network corrects it. The viewer must not be left with a
  panel showing the wrong time or an instance cut off from its data.
ref: ''
