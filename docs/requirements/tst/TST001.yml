text: |
  Apply power to the kiosk with nobody at the panel, then read which page the browser shows and
  its state. Pass if, within the check's wait, it is the WiseKiosk page in its ready state. Fail
  if it is an error page, still loading, a browser error, or anything else.
verification-justification: |
  Settles that the browser reaches the ready page unaided from power-on. Leaves unproven what
  reaches the glass, so a panel that is off or disconnected still passes.
verification-method: test
