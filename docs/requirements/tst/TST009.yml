text: |
  Hash the deployed rootfs and compare it to the bundle's own digest, and assert the
  display's served entry point is present in the rootfs.
verification-justification: |
  Settles that the bundle ties to the deployed rootfs by hash (tools/reproducibility-gate.sh,
  run by every install kiosk-preflight gates) and that the display's served entry point is
  present in it, read from this build's own artifacts. The failure branch is proven on
  constructed input and was watched failing on a mutated copy of the artefacts when the check
  was built. Leaves unproven whether the served files are themselves correct once applied, and
  anything installed by a recipe kiosk-preflight does not gate (docs/testing.md names them).
verification-method: test
