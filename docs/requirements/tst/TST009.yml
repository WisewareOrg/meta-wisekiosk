status: proposed
text: |
  With the WiseKiosk instance showing the replayed page, four park cards live, ride names scrolling,
  the tour and the weather series turning on their own timers, measure the page's frame intervals
  over a 320 second window that opens 40 seconds after the page is complete. Pass if no more than 24
  of them are 250 milliseconds or longer. The check is invalid if the page reloads or changes state
  inside the window, or shows too little motion.
verification-justification: |
  Test. It measures against a stated bound; the pass condition needs no judgement.
verification-method: test
