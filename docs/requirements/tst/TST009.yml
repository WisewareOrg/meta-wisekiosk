text: |
  With nobody at the panel, make the system stop responding entirely, so that nothing on it runs.
  Pass if the kiosk restarts by itself and comes back showing the WiseKiosk page in its ready
  state within the check's wait.
verification-justification: |
  Settles recovery from a whole-system hang. Leaves unproven a partial hang, where the system runs
  but the browser or display is frozen, and a hang before the protection is armed during boot.
verification-method: test
