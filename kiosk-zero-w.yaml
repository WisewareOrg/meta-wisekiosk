# The kas entry point: includes the pins (includes/base.yaml) and the machine, and configures this
# image: WPE WebKit straight to DRM (ADR 0001 rev 2).
header:
  version: 20
  includes:
    - includes/base.yaml
    - includes/platforms/raspberrypi-zero-w.yaml

build_system: oe
distro: autonomos
target: [core-image-base, kiosk-bootprof]

local_conf_header:
  standard: |
    PATCHRESOLVE = "noop"
    CONF_VERSION = "2"
    USER_CLASSES ?= "buildstats"
    TMPDIR = "${TOPDIR}/tmp-${MACHINE}"

  # debug-tweaks: empty root password and root SSH login. core-image-base implies no ssh server.
  extras: |
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks ssh-server-openssh"
    IMAGE_FEATURES:remove = "splash"

  # Reboot after a panic that comes before userspace; kiosk-hardware's kernel.panic applies once it is
  # up. cmdline.txt is on the shared /boot (docs/updates.md §"The shared /boot").
  panic-reboot: |
    CMDLINE:append = " panic=10"

  # A hard set: meta-raspberrypi's default is ??=.
  kernel: |
    PREFERRED_VERSION_linux-raspberrypi = "6.12.%"

  display: |
    # The panel is the only console; a serial console writes every printk synchronously to the UART.
    CMDLINE_SERIAL = "console=tty1"

  # Firmware KMS, a config.txt line (docs/display.md §"Firmware KMS"). mesa is held at poky's
  # version, which `just preferred-version` reports behind (docs/display.md §"The panel").
  graphics: |
    VC4DTBO = "vc4-fkms-v3d"
    PREFERRED_VERSION_mesa = "24.0.7"
    PREFERRED_VERSION_mesa-gl = "24.0.7"

  kiosk: |
    # Only what the page uses (docs/display.md §"The engine").
    PACKAGECONFIG:pn-wpewebkit = "gbm journald reduce-size remote-inspector unified-builds woff2 wpe-platform wpe-platform-drm"
    EXTRA_OECMAKE:append:pn-wpewebkit = " -DUSE_GSTREAMER=OFF -DENABLE_WEBGL=OFF"
    BAD_RECOMMENDATIONS += "ttf-dejavu-sans ttf-dejavu-sans-mono ttf-dejavu-serif"

    IMAGE_INSTALL:append = " kiosk-cpufreq"

    # ramoops keeps the kernel's console tail across a reset. The overlay is not in
    # meta-raspberrypi's list, and its stock console-size is 0. Both lines are on /boot: card flash only.
    RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/ramoops.dtbo"
    RPI_EXTRA_CONFIG:append = "\ndtoverlay=ramoops,total-size=0x40000,record-size=0x8000,console-size=0x20000\n"
    IMAGE_INSTALL:append = " kiosk-session kiosk-soak kiosk-journal kiosk-timesync-persist kiosk-hardware kiosk-drmgrab kiosk-netcheck zram wpa-supplicant-service ttf-roboto tzdata-core tzdata-americas"

    IMAGE_INSTALL:append = " kiosk-provision"

    IMAGE_INSTALL:append = " wisekiosk-backend wisekiosk-frontend"

    # Empty, not PACKAGE_EXCLUDE: packagegroup-core-boot RDEPENDS on systemd-serialgetty, which an
    # empty value builds as an empty package.
    SERIAL_CONSOLES = ""

    DEFAULT_TIMEZONE = "America/New_York"

    # No hostname, machine-id or nameserver is set here: each is per device, on /data.
    INHERIT += "kiosk-static-resolv"

    # /etc/buildinfo (docs/image.md §"What commit an image was built from").
    INHERIT += "image-buildinfo"

    # IMAGE_CLASSES, not INHERIT: the deferred inherit lands after image.bbclass's vardeps append.
    IMAGE_CLASSES += "kiosk-buildinfo-cachesafe"

    # Named here as well as inherited through the distro (docs/security.md §"The two artifacts").
    INHERIT += "create-spdx"

  # update-bundle.bb defaults to another image and assigns both with a plain "=", which a bare
  # local.conf value does not override; the :pn- override applies after the recipe parses.
  rauc: |
    RAUC_SLOT_rootfs:pn-update-bundle = "core-image-base"

    # No casync bundle (docs/updates.md §"Delivering an update").
    RAUC_CASYNC_BUNDLE:pn-update-bundle = "0"

    # The signing key and the baked keyring (docs/updates.md §"The signing key"). The key name is one
    # of the two sites a rotation edits by hand; a rotation build overrides these from a fragment named
    # zz-rauc-rotation, which kas emits last.
    AUTONOMOS_RAUC_KEY_DIR = "${TOPDIR}/../local/keys/kiosk-2026"
    AUTONOMOS_RAUC_KEY_FILE = "signing.key.pem"
    AUTONOMOS_RAUC_CERT_FILE = "signing.cert.pem"
    AUTONOMOS_RAUC_KEYRING_FILE = "signing.cert.pem"

  trim: |
    # bluetooth leaves DISTRO_FEATURES too: packagegroup-base pulls the Bluetooth group on it alone.
    DISTRO_FEATURES:remove = " vulkan ptest bluetooth 3g nfc nfs zeroconf"

    # No language-binding data (introspection, libsoup's vala).
    DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " gobject-introspection-data"
    DEPENDS:remove:pn-libsoup = "vala"

    # WebKit draws with Skia; harfbuzz's cairo option would build cairo for nothing.
    PACKAGECONFIG:remove:pn-harfbuzz = "cairo"
    PACKAGECONFIG:remove:pn-harfbuzz-native = "cairo"

    # The BCM43430 is a combo part: this drops its Bluetooth firmware, never brcmfmac43430-sdio, the
    # WiFi firmware. keyboard and usbhost stay for the recovery console on tty2.
    MACHINE_FEATURES:remove = "bluetooth alsa touchscreen serial"

    # No busybox syslogd or klogd: journald holds the records.
    VIRTUAL-RUNTIME_base-utils-syslog = ""

    # The machine config recommends the Bluetooth firmware independently of MACHINE_FEATURES.
    MACHINE_EXTRA_RRECOMMENDS:remove = "bluez-firmware-rpidistro-bcm43430a1-hcd"

    # udev-hwdb is a recommendation of systemd; dropping it here leaves systemd's hash alone.
    BAD_RECOMMENDATIONS += "udev-hwdb"

    # tzdata-americas does not pull tzdata-core, so IMAGE_INSTALL names both.
    IMAGE_LINGUAS = "en-us"

  # BB_PRESSURE_MAX_MEMORY: bitbake starts no new task while memory stall exceeds this many
  # microseconds per second.
  parallel: |
    BB_NUMBER_THREADS = "6"
    PARALLEL_MAKE = "-j6"
    PARALLEL_MAKE:pn-wpewebkit = "-j4"
    # Strips -g and -g1 from wpewebkit's DEBUG_FLAGS; DEBUG_PREFIX_MAP stays.
    DEBUG_FLAGS:remove:pn-wpewebkit = "-g -g1"
    BB_PRESSURE_MAX_MEMORY = "20000"

  # The image's compile cache (docs/image.md §"Building").
  ccache: |
    CCACHE_TOP_DIR = "${SSTATE_DIR}/ccache"
    INHERIT += "ccache"
    # Per recipe; CCACHE_MAXSIZE must stay in the ignore line below.
    export CCACHE_MAXSIZE = "5G"
    # Exported by the ccache class; excluded from task hashes here.
    BB_BASEHASH_IGNORE_VARS:append = " CCACHE_BASEDIR CCACHE_COMPILERCHECK CCACHE_CONFIGPATH CCACHE_TEMPDIR CCACHE_MAXSIZE"

  diskmonitoring: |
    BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

  buildhistory: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
